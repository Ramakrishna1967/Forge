[project]
name = 'forge'
version = '4.0.0'
description = 'Forge - self-improving coding agent'
readme = 'README.md'
requires-python = '>=3.10'
license = {text = 'MIT'}
dependencies = [
    'openai==3.19.2',
    'pyyaml==6.0.3',
]

[project.optional-dependencies]
vector = ['faiss-cpu', 'chromadb']
dev = ['pytest==9.1.1', 'coverage==7.15.2']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-v'

[tool.coverage.run]
source = ['.']
omit = ['tests/*', 'examples/*']

[tool.coverage.report]
fail_under = 70
show_missing = true
